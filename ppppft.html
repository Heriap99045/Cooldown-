.stage{position:relative;width:calc(var(--s)*100);height:calc(var(--s)*56.25);color:var(--wine);font-family:"Jost",system-ui,sans-serif}
.photos,.panel{position:absolute;top:10.37%;height:72.22%;overflow:hidden}
.photos{left:3.594%;width:55.47%;background:linear-gradient(var(--blush1),var(--blush2))}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease}
.slide.on{opacity:1}
.slide img{position:absolute;inset:0;width:100%;height:100%}
.slide .bg{object-fit:cover;filter:blur(calc(var(--u)*2.2)) brightness(.95);transform:scale(1.15)}
.slide .fg{object-fit:contain}
.panel{left:59.0625%;width:37.24%;background:linear-gradient(var(--blush1),var(--blush2));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 calc(var(--u)*1.5) calc(var(--u)*7)}
.qs{background:linear-gradient(160deg,#f9efe9,#ecd6cc);display:flex;align-items:center;justify-content:center;text-align:center;padding:calc(var(--u)*3) calc(var(--u)*9)}
.qs::before{content:"";position:absolute;inset:calc(var(--u)*1.6);border:1px solid rgba(125,35,48,.35);pointer-events:none}
.qs .orn{font-size:calc(var(--u)*1.8);color:var(--wine2);letter-spacing:.5em;margin-bottom:calc(var(--u)*1.4)}
.qs .q{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:calc(var(--u)*2.6);line-height:1.3;color:var(--wine)}
.qs .r{margin-top:calc(var(--u)*1.4);font-size:calc(var(--u)*1.7);letter-spacing:.04em;color:var(--wine2)}
.frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bis{font-family:"Amiri",serif;font-size:calc(var(--u)*3.2);line-height:1.2}
.lead{margin-top:calc(var(--u)*1.4);font-size:calc(var(--u)*2.1);letter-spacing:.03em}
.count{display:flex;justify-content:center;gap:calc(var(--u)*1.2);margin-top:calc(var(--u)*1.4)}
.unit{min-width:calc(var(--u)*8.6)}
.num{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:calc(var(--u)*6.6);line-height:1;font-variant-numeric:tabular-nums}
.lbl{font-size:calc(var(--u)*1.7);color:var(--wine2)}
.when{margin-top:calc(var(--u)*2.4);font-size:calc(var(--u)*1.8);color:var(--wine2);line-height:1.35}
.note{margin-top:calc(var(--u)*.8);font-size:calc(var(--u)*1.7);color:var(--wine2)}
</style>
